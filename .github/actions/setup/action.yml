name: Setup Bun
description: Setup Bun and install dependencies
runs:
  using: composite
  steps:
    - name: Install Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
