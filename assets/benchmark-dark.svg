<svg xmlns="http://www.w3.org/2000/svg" width="640" height="396" viewBox="0 0 640 396" role="img" aria-labelledby="title desc">
<title id="title">NestJS requests per second for GET /</title>
<desc id="desc">Bar chart of NestJS requests per second for GET /, higher is better. Bun: platform-hono 117,870, platform-fastify 106,651, platform-express 87,378. Node.js: platform-node (unreleased) 110,690, platform-fastify 102,148, platform-hono 90,645, platform-express 66,201. Apple M4 · wrk -t4 -c100, 3 s warmup · NestJS 11.2.7. platform-node (unreleased): NestJS 12.1.2 from nestjs/nest#18063, Node.js only.</desc>
<style>text{font:16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#9198a1}
.strong,text.hl{fill:#f0f6fc;font-weight:600}
.muted{font-weight:400}
.muted,.note{fill:#9198a1}
.note{font-size:13px}
.label{text-anchor:end}
.axis{stroke:#3d444d}
.bar{fill:#484f58;transform-box:fill-box;transform-origin:0 50%;animation:grow 1.2s cubic-bezier(.33,1,.68,1) var(--bar-delay) both}
.bar.hl{fill:#d95926}
.value{animation:show .3s ease-out var(--value-delay) both}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes show{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.bar,.value{animation:none}}</style>
