<svg xmlns="http://www.w3.org/2000/svg" width="880" height="554" viewBox="0 0 880 554" role="img" aria-labelledby="title desc">
<title id="title">NestJS requests per second for GET /</title>
<desc id="desc">Race chart of NestJS requests per second for GET /, fastest first, where a faster ball serves more requests per second: platform-hono on Bun 141,294, platform-node on Bun 120,587, platform-node on Node.js 110,347, platform-fastify on Node.js 103,280, platform-fastify on Bun 102,153, platform-hono on Node.js 101,533, platform-express on Bun 93,484, platform-express on Node.js 74,187. Apple M4 · wrk -t4 -c100, 3 s warmup. platform-hono, platform-fastify, platform-express, platform-node: NestJS 12.3.2.</desc>
