.ok{font-size:10px;fill:#39d98a;opacity:0;animation:ok var(--trip) linear infinite}
@keyframes trip{50%{transform:translateX(253px)}}
@keyframes ok{0%,44%,61%,100%{opacity:0}45%,60%{opacity:1}}
